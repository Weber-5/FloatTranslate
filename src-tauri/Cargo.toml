[package]
name = "floattranslate"
version = "1.0.0"
description = "FloatTranslate Windows host: frameless window, tray, single instance and Go sidecar supervision."
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "floattranslate_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rand = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
