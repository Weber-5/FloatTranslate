[package]
name = "floattranslate"
version = "1.0.2"
description = "FloatTranslate Windows host: frameless window, tray, single instance and Go sidecar supervision."
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "floattranslate_lib"
path = "src/lib.rs"

[features]
# Production builds embed frontend/dist and serve it via the tauri:// protocol;
# without this feature even release binaries load `build.devUrl` (Tauri v2
# dev/prod switch). `tauri build` enables it automatically; plain
# `cargo build --release` must pass `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rand = "0.9"
thiserror = "2"

# Windows-only selection capture (docs/07 §5): clipboard save/restore plus
# SendInput for the simulated Ctrl+C.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# `test` feature unlocks `tauri::test` (mock runtime) for the opt-in autostart
# E2E round-trip; it never affects normal builds.
tauri = { version = "2", features = ["test"] }
