openapi: 3.1.0
info:
  title: FloatTranslate Local API
  version: 1.1.0
  description: >-
    Local loopback API contract between the Vue frontend and Go backend.
    Business endpoints require a per-run bearer token generated by the Tauri host.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "0"
security:
  - LocalSessionBearer: []
paths:
  /runtime/capabilities:
    get:
      operationId: getRuntimeCapabilities
      responses:
        "200":
          description: Effective provider/runtime capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeCapabilities" }
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Non-secret app settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSettings" }
      responses:
        "200": { description: Updated }
  /settings/provider:
    get:
      operationId: getProviderSettings
      responses:
        "200":
          description: Provider settings with masked credential state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSettingsView" }
    put:
      operationId: updateProviderSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSettingsUpdate" }
      responses:
        "200": { description: Saved }
  /settings/provider/test:
    post:
      operationId: testProviderConnection
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
  /translations:
    post:
      operationId: createTranslation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslationRequest" }
      responses:
        "200":
          description: Translation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationResponse" }
        default:
          $ref: "#/components/responses/Error"
  /translations/{id}:
    get:
      operationId: getTranslation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Saved translation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationResponse" }
  /translations/{id}/retranslate:
    post:
      operationId: retranslate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Fresh result bypassing cache
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationResponse" }
  /history:
    get:
      operationId: listHistory
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [word, text] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: History page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryItem" }
                  next_cursor: { type: [string, "null"] }
    delete:
      operationId: clearHistory
      responses:
        "204": { description: Cleared }
  /history/{id}:
    delete:
      operationId: deleteHistoryItem
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
  /vocabulary:
    get:
      operationId: listVocabulary
      parameters:
        - { name: query, in: query, schema: { type: string } }
      responses:
        "200":
          description: Vocabulary list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VocabularyItem" }
  /vocabulary/{lemma}:
    put:
      operationId: saveVocabulary
      parameters:
        - { name: lemma, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WordTranslation" }
      responses:
        "200": { description: Saved or refreshed }
    delete:
      operationId: deleteVocabulary
      parameters:
        - { name: lemma, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /terminology:
    get:
      operationId: listTerminology
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TerminologyItem" }
    post:
      operationId: createTerminology
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminologyMutation" }
      responses:
        "201": { description: Created }
  /terminology/{id}:
    put:
      operationId: updateTerminology
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminologyMutation" }
      responses:
        "200": { description: Updated }
    delete:
      operationId: deleteTerminology
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
  /tabs:
    get:
      operationId: getTabs
      responses:
        "200":
          description: Persisted tabs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TabState" }
    put:
      operationId: putTabs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/TabState" }
      responses:
        "204": { description: Persisted }
  /chats:
    get:
      operationId: listChats
      responses:
        "200":
          description: Chat list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Chat" }
    post:
      operationId: createChat
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
  /chats/{id}:
    patch:
      operationId: updateChat
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        "200": { description: Updated }
    delete:
      operationId: deleteChat
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Deleted }
  /chats/{id}/messages:
    get:
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      operationId: clearChatMessages
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Messages and compact summary deleted; conversation context retained }
  /chats/{id}/context:
    get:
      operationId: getConversationContext
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextValue" }
    put:
      operationId: putConversationContext
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextValue" }
      responses:
        "204": { description: Updated }
  /context/global:
    get:
      operationId: getGlobalContext
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextValue" }
    put:
      operationId: putGlobalContext
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextValue" }
      responses:
        "204": { description: Updated }
  /chats/{id}/compact:
    post:
      operationId: compactChat
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Compact summary updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { type: string }
  /chats/{id}/generations:
    post:
      operationId: streamChatGeneration
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatGenerationRequest" }
      responses:
        "200":
          description: "SSE stream. Events: generation.started, reasoning.delta, content.delta, generation.completed, generation.error, generation.cancelled."
          content:
            text/event-stream:
              schema: { type: string }
  /chats/{id}/regenerate:
    post:
      operationId: regenerateLastAssistantMessage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
  /chats/{id}/generations/{generationId}/cancel:
    post:
      operationId: cancelGeneration
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: generationId, in: path, required: true, schema: { type: string } }
      responses:
        "202": { description: Cancellation requested }
  /backup/export:
    post:
      operationId: exportBackup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePathRequest" }
      responses:
        "200": { description: Exported }
  /backup/import:
    post:
      operationId: importBackup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePathRequest" }
      responses:
        "200": { description: Imported and merged }
  /data/clear-business:
    post:
      operationId: clearBusinessData
      responses:
        "204": { description: Cleared while preserving credential and basic preferences }
  /data/reset-app:
    post:
      operationId: resetApp
      responses:
        "204": { description: Backend data and credential cleared; Tauri must also clear window state }
components:
  securitySchemes:
    LocalSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-session-token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Standard error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            details: { type: object, additionalProperties: true }
    RuntimeCapabilities:
      type: object
      properties:
        configured_context_tokens: { type: integer }
        effective_context_tokens: { type: integer }
        configured_output_tokens: { type: integer }
        effective_output_tokens: { type: integer }
        supports_thinking: { type: boolean }
        supports_structured_output: { type: boolean }
    AppSettings:
      type: object
      additionalProperties: true
      description: Non-secret settings. Concrete typed client model should be generated/refined from the final schema before implementation.
    ProviderSettingsView:
      type: object
      required: [mode, base_url, translation_model, chat_model, api_key_configured]
      properties:
        mode: { type: string, enum: [deepseek, openai_compatible] }
        base_url: { type: string }
        translation_model: { type: string }
        chat_model: { type: string }
        api_key_configured: { type: boolean }
        api_key_hint: { type: string }
    ProviderSettingsUpdate:
      type: object
      required: [mode, base_url, translation_model, chat_model]
      properties:
        mode: { type: string, enum: [deepseek, openai_compatible] }
        base_url: { type: string }
        translation_model: { type: string }
        chat_model: { type: string }
        api_key: { type: string, writeOnly: true }
    TranslationRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        force_kind: { type: string, enum: [word, text] }
        bypass_cache: { type: boolean, default: false }
    TranslationResponse:
      type: object
      required: [translation_id, kind, source, result, model, created_at]
      properties:
        translation_id: { type: string }
        kind: { type: string, enum: [word, text] }
        source: { type: string, enum: [model, cache] }
        result:
          oneOf:
            - $ref: "#/components/schemas/WordTranslation"
            - $ref: "#/components/schemas/TextTranslation"
        model: { type: string }
        created_at: { type: string, format: date-time }
    WordTranslation:
      type: object
      required: [word, lemma, phonetic_uk, phonetic_us, parts_of_speech, synonyms, inflections]
      properties:
        word: { type: string }
        lemma: { type: string }
        phonetic_uk: { type: string }
        phonetic_us: { type: string }
        parts_of_speech:
          type: array
          items:
            type: object
            required: [part, meanings]
            properties:
              part: { type: string }
              meanings: { type: array, items: { type: string } }
        synonyms: { type: array, items: { type: string } }
        inflections: { type: array, items: { type: string } }
    TextTranslation:
      type: object
      required: [source_markdown, translated_markdown, segments]
      properties:
        source_markdown: { type: string }
        translated_markdown: { type: string }
        segments:
          type: array
          items:
            type: object
            required: [source, translation]
            properties:
              source: { type: string }
              translation: { type: string }
    HistoryItem:
      type: object
      required: [id, kind, input_text, result, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [word, text] }
        input_text: { type: string }
        result:
          oneOf:
            - $ref: "#/components/schemas/WordTranslation"
            - $ref: "#/components/schemas/TextTranslation"
        source: { type: string, enum: [model, cache] }
        model: { type: string }
        created_at: { type: string, format: date-time }
    VocabularyItem:
      type: object
      required: [lemma, word, saved_at, last_viewed_at]
      properties:
        lemma: { type: string }
        word: { $ref: "#/components/schemas/WordTranslation" }
        saved_at: { type: string, format: date-time }
        last_viewed_at: { type: string, format: date-time }
    TerminologyItem:
      allOf:
        - $ref: "#/components/schemas/TerminologyMutation"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    TerminologyMutation:
      type: object
      required: [source, target]
      properties:
        source: { type: string }
        target: { type: string }
    TabState:
      type: object
      required: [id, kind, title, position, is_active, payload]
      properties:
        id: { type: string }
        kind: { type: string, enum: [word, text] }
        title: { type: string }
        position: { type: integer }
        is_active: { type: boolean }
        payload: { type: object, additionalProperties: true }
    Chat:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        reasoning_content: { type: string }
        created_at: { type: string, format: date-time }
    ChatGenerationRequest:
      type: object
      required: [content, thinking]
      properties:
        content: { type: string }
        thinking: { type: boolean, default: false }
        reference_text: { type: string }
    ContextValue:
      type: object
      required: [content]
      properties:
        content: { type: string }
    FilePathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
